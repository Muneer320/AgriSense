server {
  # Preserve the browser's published port on directory redirects (e.g. /sign-in).
  absolute_redirect off;
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ =404; }
  location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location = /sw.js { add_header Cache-Control "no-store"; }
  location = /service-worker.js { add_header Cache-Control "no-store"; }
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
}
